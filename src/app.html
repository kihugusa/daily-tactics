<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tactics">
<!--PWA_LINKS-->
<title>Daily Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday habit: calm focus, club-room warmth, a scoreboard for the numbers
   IDEA a tournament scoresheet beside a wooden board: walnut, maple, felt
   PICTURE the board itself, as large as the screen allows, under a modest title
   COLOUR maple ground, walnut ink and bands, one clear blue for actions; green/red for right/wrong
   TYPE Outfit 800 for titles and numbers + Inter
   LAYOUT phone: title, tabs, board, status, controls; wide: board left, panel right */
/*CG_CSS*/
:root{color-scheme:light dark;--bg:light-dark(#fbf7f1,#16120e);--ink:light-dark(#2b2118,#f1e9dd);--mute:light-dark(#7a6b5c,#a8998a);--line:light-dark(#e6dccd,#3a3128);--soft:light-dark(#f2eadf,#211b15);--act:light-dark(#2457d6,#6d93ff);--ok:light-dark(#1f8a4c,#43d081);--bad:light-dark(#c7392b,#ff6f61);--warn:light-dark(#a86a00,#ffbf47)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font:800 clamp(30px,8vw,40px)/1 Outfit,Inter,sans-serif;letter-spacing:-.02em;margin:0;flex:1 1 auto}
.pills{display:flex;gap:6px}
.pill{font:600 13px Inter,sans-serif;padding:5px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill b{font:800 15px Outfit,Inter,sans-serif}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14.5px;min-height:42px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.main{display:grid;gap:16px}
@media(min-width:860px){.main{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}}
.boardbox{width:100%;max-width:560px;margin:0 auto}
.board{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.cg-wrap coords{font:600 10px Inter,sans-serif;opacity:1;color:rgba(43,33,24,.62)}
.cg-wrap coords.ranks{left:3px;top:2px;width:12px;height:100%}
.cg-wrap coords.ranks coord{display:flex;align-items:flex-start}
.cg-wrap coords.files{left:0;bottom:2px;height:14px}
.cg-wrap coords.files coord{display:flex;justify-content:flex-end;padding-right:3px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.icon{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;font-size:20px}
.icon:disabled{opacity:.35;cursor:default}
.day{font:800 20px Outfit,Inter,sans-serif}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;min-height:40px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font:800 22px/1.2 Outfit,Inter,sans-serif;margin:12px 0 6px;min-height:1.2em}
.status.good{color:var(--ok)}.status.bad{color:var(--bad)}.status.warn{color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14.5px;color:var(--mute);margin-bottom:12px}
.meta b{color:var(--ink)}.meta a{color:var(--act);font-weight:600}
.mute{color:var(--mute)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.ctrls button,.primary{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 16px;min-height:46px;font-weight:600;cursor:pointer}
.ctrls button.primary,.primary{background:var(--act);border-color:var(--act);color:#fff}
.card{background:var(--soft);border-radius:18px;padding:20px;margin-bottom:12px}
.card h2{font:800 30px/1.05 Outfit,Inter,sans-serif;margin:0 0 6px}
.card p{margin:6px 0 14px}
.rushline{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.big{font:800 32px Outfit,Inter,sans-serif;font-variant-numeric:tabular-nums}
#rMiss{display:flex;gap:6px;margin-left:auto}
#rMiss i{width:16px;height:16px;border-radius:50%;border:2px solid var(--bad)}
#rMiss i.x{background:var(--bad)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px;margin-bottom:8px}
.nums div{background:var(--soft);border-radius:14px;padding:12px}
.nums b{display:block;font:800 30px/1 Outfit,Inter,sans-serif;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--mute)}
h3{font:800 20px Outfit,Inter,sans-serif;margin:18px 0 6px}
.spark{width:100%;height:120px;color:var(--act);background:var(--soft);border-radius:12px}
.trow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 7.5em;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.trow .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:0}
.trow .bar i{display:block;height:100%;background:var(--act)}
.trow span:last-child{text-align:right;white-space:nowrap;color:var(--mute)}
.credit{font-size:13px;color:var(--mute);margin-top:22px}
.credit a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Daily Tactics</h1>
    <div class="pills"><span class="pill">Rating <b id="ratingPill">1200</b></span><span class="pill">Streak <b id="streakPill">0</b></span></div>
  </header>
  <div class="tabs" role="group" aria-label="Mode">
    <button data-m="daily" aria-pressed="true">Today</button>
    <button data-m="train" aria-pressed="false">Train</button>
    <button data-m="rush" aria-pressed="false">Rush</button>
    <button data-m="stats" aria-pressed="false">Stats</button>
  </div>

  <div class="bar" id="dailyBar"><button class="icon" id="prevDay" aria-label="Previous day">‹</button><span class="day" id="dayLabel"></span><button class="icon" id="nextDay" aria-label="Next day">›</button></div>
  <div id="trainBar" hidden><div class="chips" id="themes" role="group" aria-label="Theme"></div></div>
  <div id="rushBar" hidden></div>

  <div class="main" id="play">
    <div class="boardbox"><div class="board" id="board"></div></div>
    <div>
      <p class="status" id="status" role="status" aria-live="polite">Loading puzzles…</p>
      <div class="meta" id="meta"></div>
      <div class="ctrls"><button id="hintBtn">Hint</button><button id="solBtn">Show solution</button><button class="primary" id="nextBtn" hidden>Next puzzle</button></div>
      <p class="credit">Puzzles from the <a href="https://database.lichess.org/" target="_blank" rel="noopener">Lichess puzzle database</a> (CC0). Board by Chessground, moves by chess.js. <a href="https://github.com/kihugusa/daily-tactics" target="_blank" rel="noopener">Source (GPL-3.0)</a>.</p>
    </div>
  </div>
  <div id="statsView" hidden></div>
</div>
<!--DATA-->
<!--BUNDLE-->
</body>
</html>
